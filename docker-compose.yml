x-runtime-defaults: &runtime-defaults
  init: true
  pids_limit: 256
  mem_limit: 512m
  cpus: 1.0
  stop_grace_period: 50s
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mysql:
    <<: *runtime-defaults
    image: mysql:8.4
    mem_limit: 1g
    cpus: 2.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kwantuhub}
      MYSQL_USER: ${MYSQL_USER:-kwantuhub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  garage:
    <<: *runtime-defaults
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY_ID:?Set GARAGE_ACCESS_KEY_ID in .env}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_ACCESS_KEY:?Set GARAGE_SECRET_ACCESS_KEY in .env}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-kwantuhub}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in .env}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: [ "CMD", "/garage", "status" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  migrate:
    <<: *runtime-defaults
    profiles: ["maintenance"]
    image: kwantuhub-local:local
    command: ["pnpm", "exec", "drizzle-kit", "migrate"]
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-kwantuhub}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-kwantuhub}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  import-assets:
    <<: *runtime-defaults
    profiles: ["maintenance"]
    image: kwantuhub-local:local
    command: ["node", "dist/import-assets.js"]
    environment:
      NODE_ENV: production
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: ${S3_BUCKET:-kwantuhub}
      S3_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      PUBLIC_MEDIA_BASE_URL: /media
      ASSET_DIR: /assets
    volumes:
      - ./docs/s3-assets-export:/assets:ro
    depends_on:
      garage:
        condition: service_healthy
    restart: "no"

  dev-bootstrap:
    <<: *runtime-defaults
    profiles: ["development"]
    image: kwantuhub-local:local
    command:
      [
        "sh",
        "-c",
        "node dist/import-assets.js && pnpm db:seed",
      ]
    environment:
      NODE_ENV: development
      ENABLE_DEMO_ACCOUNTS: "true"
      DATABASE_URL: mysql://${MYSQL_USER:-kwantuhub}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-kwantuhub}
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: ${S3_BUCKET:-kwantuhub}
      S3_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      PUBLIC_MEDIA_BASE_URL: /media
      ASSET_DIR: /assets
    volumes:
      - ./docs/s3-assets-export:/assets:ro
    depends_on:
      mysql:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: "no"

  app:
    <<: *runtime-defaults
    image: kwantuhub-local:local
    build:
      context: .
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DATABASE_URL: mysql://${MYSQL_USER:-kwantuhub}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-kwantuhub}
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: ${S3_BUCKET:-kwantuhub}
      S3_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      PUBLIC_MEDIA_BASE_URL: /media
      ENABLE_NOTIFICATION_WORKER: "false"
      WORKER_HEARTBEAT_FILE: /run/kwantu-worker/heartbeat.json
      SENDPULSE_CLIENT_ID: ${SENDPULSE_CLIENT_ID:-}
      SENDPULSE_CLIENT_SECRET: ${SENDPULSE_CLIENT_SECRET:-}
      SENDPULSE_API_KEY: ${SENDPULSE_API_KEY:-}
      SENDPULSE_API_FROM_EMAIL: ${SENDPULSE_API_FROM_EMAIL:-}
      SENDPULSE_API_FROM_NAME: ${SENDPULSE_API_FROM_NAME:-KwantuHub}
      SENDPULSE_WEBHOOK_TOKEN: ${SENDPULSE_WEBHOOK_TOKEN:-}
      DIDIT_API_KEY: ${DIDIT_API_KEY:-}
      DIDIT_WORKFLOW_ID: ${DIDIT_WORKFLOW_ID:-}
      DIDIT_WEBHOOK_SECRET: ${DIDIT_WEBHOOK_SECRET:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
      TURNSTILE_EXPECTED_HOSTNAME: ${TURNSTILE_EXPECTED_HOSTNAME:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-twilio}
      SENDPULSE_SMS_SENDER: ${SENDPULSE_SMS_SENDER:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - worker-runtime:/run/kwantu-worker:ro
    depends_on:
      mysql:
        condition: service_healthy
      garage:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/ready', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    <<: *runtime-defaults
    image: kwantuhub-local:local
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      WORKER_HEARTBEAT_FILE: /run/kwantu-worker/heartbeat.json
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DATABASE_URL: mysql://${MYSQL_USER:-kwantuhub}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-kwantuhub}
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: ${S3_BUCKET:-kwantuhub}
      S3_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      APP_URL: ${APP_URL:-http://localhost:3000}
      SENDPULSE_CLIENT_ID: ${SENDPULSE_CLIENT_ID:-}
      SENDPULSE_CLIENT_SECRET: ${SENDPULSE_CLIENT_SECRET:-}
      SENDPULSE_API_KEY: ${SENDPULSE_API_KEY:-}
      SENDPULSE_API_FROM_EMAIL: ${SENDPULSE_API_FROM_EMAIL:-}
      SENDPULSE_API_FROM_NAME: ${SENDPULSE_API_FROM_NAME:-KwantuHub}
      SENDPULSE_WEBHOOK_TOKEN: ${SENDPULSE_WEBHOOK_TOKEN:-}
    depends_on:
      mysql:
        condition: service_healthy
      garage:
        condition: service_healthy
    volumes:
      - worker-runtime:/run/kwantu-worker
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql-data:
  garage-meta:
  garage-data:
  worker-runtime:
