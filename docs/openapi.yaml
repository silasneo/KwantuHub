openapi: 3.0.3
info:
  title: KwantuHub API
  version: 0.2.0
  description: Versioned MVP REST API for the KwantuHub African Diaspora Marketplace.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Check API and PostgreSQL health
      responses:
        "200": { description: Healthy }
        "503": { description: Database unavailable }
  /auth/register:
    post:
      summary: Register a buyer or vendor and create a session
      responses:
        {
          "201": { description: Registered },
          "409": { description: Duplicate email },
          "422": { description: Invalid input },
        }
  /auth/login:
    post:
      summary: Create a database-backed session
      responses:
        {
          "200": { description: Authenticated },
          "401": { description: Invalid credentials },
        }
  /auth/logout:
    post:
      summary: Revoke the current session
      responses: { "200": { description: Logged out } }
  /auth/me:
    get:
      summary: Return the current user and vendor profile
      responses:
        {
          "200": { description: Current user },
          "401": { description: Unauthorized },
        }
  /categories:
    get:
      summary: List active marketplace categories
      responses: { "200": { description: Category taxonomy } }
  /listings:
    get:
      summary: Search published listings or return the authenticated vendor's listings with mine=true
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
        - {
            in: query,
            name: type,
            schema: { type: string, enum: [PRODUCT, SERVICE] },
          }
        - { in: query, name: location, schema: { type: string } }
        - { in: query, name: price, schema: { type: string } }
        - { in: query, name: remote, schema: { type: boolean } }
        - { in: query, name: verified, schema: { type: boolean } }
        - {
            in: query,
            name: sort,
            schema: { type: string, enum: [newest, oldest, title] },
          }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, default: 12, maximum: 48 },
          }
      responses: { "200": { description: Paginated listings } }
    post:
      summary: Create an approved vendor's listing draft
      security: [{ cookieAuth: [] }]
      responses:
        {
          "201": { description: Draft created },
          "403": { description: Vendor approval required },
        }
  /listings/{slug}:
    get:
      summary: Get a published listing and record its view
      parameters:
        [{ in: path, name: slug, required: true, schema: { type: string } }]
      responses:
        { "200": { description: Listing }, "404": { description: Not found } }
    patch:
      summary: Edit or publish, hide, or archive a vendor-owned listing
      security: [{ cookieAuth: [] }]
      responses:
        {
          "200": { description: Listing updated },
          "403": { description: Forbidden },
        }
  /listings/{slug}/media:
    post:
      summary: Upload a validated listing image
      security: [{ cookieAuth: [] }]
      responses:
        {
          "201": { description: Media saved },
          "422": { description: Invalid image },
        }
  /search:
    get:
      summary: Alias for public listing search
      responses: { "200": { description: Paginated listings } }
  /vendors:
    get:
      summary: List approved vendors
      responses: { "200": { description: Vendors } }
    patch:
      summary: Complete and submit the authenticated vendor profile
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Profile submitted } }
  /vendors/{slug}:
    get:
      summary: Get a public approved storefront
      responses:
        {
          "200": { description: Vendor storefront },
          "404": { description: Not found },
        }
  /storefronts:
    get:
      summary: Get the authenticated vendor storefront
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Storefront } }
    patch:
      summary: Create or update an approved vendor storefront
      security: [{ cookieAuth: [] }]
      responses:
        {
          "200": { description: Storefront updated },
          "403": { description: Approval required },
        }
  /storefronts/media:
    post:
      summary: Upload storefront logo or cover image
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Storefront image updated } }
  /wishlist:
    get:
      summary: Get current buyer saved listings
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Wishlist } }
    post:
      summary: Save a published listing
      security: [{ cookieAuth: [] }]
      responses: { "201": { description: Saved } }
    delete:
      summary: Remove a saved listing
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Removed } }
  /inquiries:
    get:
      summary: Get buyer or vendor inquiry inbox
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Inquiries with messages } }
    post:
      summary: Create a buyer inquiry and first message
      security: [{ cookieAuth: [] }]
      responses:
        {
          "201": { description: Inquiry created },
          "403": { description: Buyer role required },
        }
  /messages:
    post:
      summary: Reply to an inquiry as a participant
      security: [{ cookieAuth: [] }]
      responses:
        {
          "201": { description: Message persisted },
          "403": { description: Not a participant },
        }
  /analytics:
    get:
      summary: Get vendor listing view, save, and inquiry counts
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Vendor metrics } }
  /admin/vendors:
    get:
      summary: List pending vendor applications
      security: [{ cookieAuth: [] }]
      responses:
        {
          "200": { description: Pending vendors },
          "403": { description: Admin required },
        }
    patch:
      summary: Approve, reject, or suspend a vendor
      security: [{ cookieAuth: [] }]
      responses:
        {
          "200": { description: Status updated },
          "403": { description: Admin required },
        }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: kwantu_session }
