<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KwantuHub — Listing details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared-header.css">
  <style>:root{--paper:#F0E8DC;--ink:#0A0A0A;--muted:#68635c;--pink:#D71466;--line:#d9d0c4;--serif:"Cormorant Garamond",Georgia,serif;--grad:linear-gradient(100deg,#D71466,#FE8129)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif}main{width:min(1180px,calc(100% - 56px));margin:0 auto;padding:48px 0 82px}.back{color:var(--muted);font:800 10px system-ui;text-transform:uppercase;text-decoration:none;letter-spacing:.08em}.detail{margin-top:24px;display:grid;grid-template-columns:1.05fr .95fr;gap:52px}.visual{min-height:580px;background:#ded6cb}.visual img{width:100%;height:100%;object-fit:cover}.eyebrow{margin:0 0 13px;color:var(--pink);font:800 10px system-ui;text-transform:uppercase;letter-spacing:.1em}h1{margin:0 0 17px;font:700 clamp(44px,5vw,72px)/.88 var(--serif);letter-spacing:-.06em}.price{margin:0 0 18px;font:700 32px/1 var(--serif)}.vendor{padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font:600 18px/1.2 var(--serif)}.vendor span{display:block;margin-top:4px;color:var(--muted);font:700 10px system-ui;text-transform:uppercase;letter-spacing:.07em}.copy{margin:27px 0;color:var(--muted);font:500 22px/1.3 var(--serif)}.cta{width:100%;min-height:51px;color:#fff;border:0;background:var(--grad);font:800 11px system-ui;text-transform:uppercase;letter-spacing:.09em}.note{margin:13px 0 0;color:var(--muted);font:500 15px/1.2 var(--serif)}.toast{position:fixed;right:20px;bottom:20px;display:none;padding:13px 16px;color:#fff;border-left:3px solid #FE8129;background:#0A0A0A;font-size:12px}.toast.show{display:block}@media(max-width:760px){main{width:min(100% - 40px,640px);padding:30px 0 60px}.detail{grid-template-columns:1fr;gap:27px}.visual{min-height:370px}.copy{font-size:20px}}</style>
</head>
<body><script src="shared-header.js"></script><main><a class="back" href="marketplace.html">← Back to marketplace</a><section class="detail" id="detail"></section></main><div class="toast" id="toast"></div><script src="catalog.js"></script><script>const id=new URLSearchParams(location.search).get('listing');const item=window.KwantuCatalog.find(x=>x.id===id)||window.KwantuCatalog[0];document.title=`KwantuHub — ${item.title}`;document.querySelector('#detail').innerHTML=`<div class="visual"><img src="${item.image}" alt="${item.title}"></div><div><p class="eyebrow">${item.kind} / ${item.category}</p><h1>${item.title}</h1><p class="price">${item.price}</p><div class="vendor">${item.vendor}<span>⌖ ${item.location}</span></div><p class="copy">${item.description}</p><button class="cta" id="cta">Contact ${item.vendor}</button><p class="note">You’ll be connected directly with the vendor to discuss availability, delivery, and the details that matter.</p></div>`;document.querySelector('#cta').onclick=()=>{const t=document.querySelector('#toast');t.textContent='Inquiry flow coming soon.';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}</script></body>
</html>
