<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KwantuHub — Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;0,900;1,500;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared-header.css">
  <style>
    :root{--paper:#F0E8DC;--white:#fff;--ink:#0A0A0A;--muted:#68635c;--line:#d9d0c4;--pink:#D71466;--orange:#FE8129;--grad:linear-gradient(100deg,#D71466,#FE8129);--serif:"Cormorant Garamond",Georgia,serif;--sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--ease:cubic-bezier(.23,1,.32,1)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}button,input,select{font:inherit}button{border:0;cursor:pointer}a{color:inherit;text-decoration:none}img{display:block;width:100%;height:100%;object-fit:cover}.shell{width:min(1480px,calc(100% - 56px));margin:auto}main{padding:25px 0 75px}.market-intro{display:flex;justify-content:space-between;gap:25px;align-items:end;margin:0 0 22px}.breadcrumb{margin:0 0 8px;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.market-intro h1{margin:0;font:700 clamp(35px,3.4vw,54px)/.86 var(--serif);letter-spacing:-.055em}.market-intro h1 em{font-weight:500}.market-intro p{max-width:370px;margin:0;color:var(--muted);font:500 18px/1.2 var(--serif)}.market-layout{display:grid;grid-template-columns:278px minmax(0,1fr);gap:18px;align-items:start}.filters{position:sticky;top:157px;padding:19px;background:var(--white);border:1px solid var(--line)}.filter-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.filter-head h2{margin:0;font:700 27px/1 var(--serif);letter-spacing:-.035em}.clear{padding:0;background:none;color:var(--pink);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.type-switch{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:19px;border:1px solid var(--ink)}.type-switch button{min-height:34px;color:var(--ink);border-right:1px solid var(--ink);background:var(--white);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.045em}.type-switch button:last-child{border:0}.type-switch button.active{color:var(--white);background:var(--ink)}.filter-block{padding:16px 0;border-top:1px solid var(--line)}.filter-block h3{margin:0 0 12px;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.09em}.category-list{display:grid;gap:2px}.category-list button{width:100%;padding:7px 0;display:flex;justify-content:space-between;color:var(--ink);background:none;text-align:left;font:600 16px/1.05 var(--serif)}.category-list button span{color:var(--muted);font:800 9px var(--sans)}.category-list button.selected{color:var(--pink)}.price-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.price-inputs label{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.price-inputs input{width:100%;height:35px;margin-top:5px;padding:0 9px;border:1px solid var(--line);outline:none;background:var(--paper);font:600 15px var(--serif)}.checks{display:grid;gap:11px}.check{display:flex;gap:9px;align-items:flex-start;color:var(--muted);font:600 14px/1.1 var(--serif)}.check input{width:15px;height:15px;margin:0;accent-color:var(--pink)}.filter-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:20px}.filter-actions button{min-height:39px;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.07em}.apply{color:var(--white);background:var(--grad)}.reset{border:1px solid var(--ink);background:transparent}.mobile-filter{display:none}.feed-toolbar{min-height:61px;margin-bottom:15px;padding:0 15px;display:flex;gap:13px;align-items:center;justify-content:space-between;border:1px solid var(--line);background:var(--white)}.result-copy{margin:0;font:600 17px/1.1 var(--serif)}.result-copy b{font-weight:800}.toolbar-right{display:flex;align-items:center;gap:10px}.sort{height:33px;padding:0 9px;border:1px solid var(--line);background:var(--paper);font-size:10px;font-weight:800}.view-toggle{display:flex;border:1px solid var(--line)}.view-toggle button{width:32px;height:31px;display:grid;place-items:center;background:var(--white);font-size:14px}.view-toggle button.active{color:var(--white);background:var(--ink)}.pills{display:flex;flex-wrap:wrap;gap:6px;margin:-3px 0 14px}.pill{padding:6px 8px;display:inline-flex;gap:6px;align-items:center;background:var(--ink);color:var(--paper);font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}.pill button{padding:0;color:inherit;background:none;font-size:14px;line-height:.5}.market-grid{columns:3 245px;column-gap:14px}.listing{width:100%;margin:0 0 14px;display:inline-block;overflow:hidden;border:1px solid var(--line);background:var(--white);break-inside:avoid;vertical-align:top;text-decoration:none;transition:transform .18s var(--ease),box-shadow .18s var(--ease)}.listing:hover{box-shadow:0 10px 28px rgba(10,10,10,.11);transform:translateY(-3px)}.listing-media{height:188px;position:relative;overflow:hidden;background:#ded6cb}.listing.tall .listing-media{height:260px}.listing.short .listing-media{height:146px}.listing-media img{transition:transform .45s var(--ease)}.listing:hover .listing-media img{transform:scale(1.04)}.heart{position:absolute;top:10px;right:10px;width:31px;height:31px;display:grid;place-items:center;border-radius:50%;color:var(--ink);background:rgba(255,255,255,.92);font-size:16px}.heart.saved{color:var(--pink)}.listing-type,.location{position:absolute;left:10px;padding:5px 7px;font-size:9px;font-weight:850;letter-spacing:.06em;text-transform:uppercase}.listing-type{top:10px;color:var(--white);background:var(--grad)}.location{bottom:10px;color:var(--ink);background:rgba(240,232,220,.94)}.listing-body{padding:13px 13px 15px}.listing-kicker{margin:0 0 6px;color:var(--muted);font-size:9px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.listing h2{margin:0 0 7px;font:700 23px/.94 var(--serif);letter-spacing:-.04em}.listing-summary{margin:0 0 10px;color:var(--muted);font:500 15px/1.13 var(--serif);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price{margin:0 0 11px;font:800 18px/1 var(--serif)}.vendor-line{margin:0;color:var(--muted);font:600 14px/1.05 var(--serif)}.detail-link{display:inline-block;margin-top:14px;padding-bottom:3px;border-bottom:1px solid var(--ink);font:800 9px var(--sans);text-transform:uppercase;letter-spacing:.08em}.market-grid.list{columns:1}.market-grid.list .listing{display:grid;grid-template-columns:250px 1fr;margin-bottom:10px}.market-grid.list .listing-media,.market-grid.list .listing.tall .listing-media,.market-grid.list .listing.short .listing-media{height:100%}.market-grid.list .listing-body{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto 1fr;column-gap:25px}.market-grid.list .listing-kicker,.market-grid.list .listing h2,.market-grid.list .listing-summary,.market-grid.list .vendor-line{grid-column:1}.market-grid.list .price{grid-column:2;grid-row:1}.market-grid.list .detail-link{grid-column:2;grid-row:3;align-self:end;white-space:nowrap}.empty{max-width:590px;margin:35px auto 0;padding:22px 25px;border:1px solid var(--ink);background:var(--white);text-align:center}.empty b{display:block;margin-bottom:6px;font:700 22px var(--serif)}.empty p{margin:0;color:var(--muted);font:500 16px/1.2 var(--serif)}@media(max-width:950px){.filters{top:150px}.market-layout{grid-template-columns:245px minmax(0,1fr)}.market-grid{columns:2 210px}}@media(max-width:720px){.shell{width:min(100% - 32px,640px)}main{padding-top:20px}.market-intro{display:block;margin-bottom:15px}.market-intro h1{font-size:42px}.market-intro p{margin-top:10px;font-size:17px}.market-layout{display:block}.mobile-filter{width:100%;min-height:42px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;border:1px solid var(--ink);background:var(--white);font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.08em}.filters{position:static;display:none;margin-bottom:12px}.filters.open{display:block}.feed-toolbar{min-height:0;padding:10px;align-items:flex-start;flex-direction:column}.toolbar-right{width:100%;justify-content:space-between}.market-grid{columns:2 145px;column-gap:9px}.listing{margin-bottom:9px}.listing-media{height:154px}.listing.tall .listing-media{height:215px}.listing.short .listing-media{height:125px}.listing-body{padding:10px}.listing h2{font-size:20px}.price{font-size:17px}.market-grid.list .listing{grid-template-columns:120px 1fr}.market-grid.list .listing-body{display:block}.market-grid.list .price{margin-top:8px}.market-grid.list .detail-link{display:inline-block}}@media(max-width:390px){.market-grid{columns:1}.listing.short .listing-media,.listing.tall .listing-media{height:195px}}
  </style>
</head>
<body>
  <script src="shared-header.js"></script>
  <main class="shell"><section class="market-intro"><div><p class="breadcrumb">Marketplace / North America</p><h1>Find what carries <em>home forward.</em></h1></div><p>Browse the goods and services from the makers already shaping the KwantuHub community.</p></section><button class="mobile-filter" id="mobile-filter">Filters <span>⚙</span></button><div class="market-layout"><aside class="filters" id="filters"><div class="filter-head"><h2>Filters</h2><button class="clear" id="clear-filters">Clear all</button></div><div class="type-switch"><button class="active" data-type="all">All listings</button><button data-type="product">Products</button><button data-type="service">Services</button></div><section class="filter-block"><h3>Category</h3><div class="category-list" id="categories"><button data-category="Fabrics & Textiles">Fabrics &amp; Textiles <span>2</span></button><button data-category="Foods & Catering">Foods &amp; Catering <span>2</span></button><button data-category="Language Learning">Language Learning <span>2</span></button><button data-category="Beauty & Natural Hair">Beauty &amp; Natural Hair <span>2</span></button></div></section><section class="filter-block"><h3>Price range</h3><div class="price-inputs"><label>Min<input id="min-price" type="number" placeholder="$0"></label><label>Max<input id="max-price" type="number" placeholder="$500+"></label></div></section><section class="filter-block"><h3>Trust &amp; delivery</h3><div class="checks"><label class="check"><input id="verified-only" type="checkbox">Verified diaspora vendor only</label><label class="check"><input id="remote-only" type="checkbox">Offers remote / virtual delivery</label></div></section><div class="filter-actions"><button class="reset" id="reset-filters">Reset</button><button class="apply" id="apply-filters">Apply filters</button></div></aside><section class="feed"><div class="feed-toolbar"><p class="result-copy" id="result-copy">Showing <b>0</b> community listings</p><div class="toolbar-right"><select class="sort" id="sort"><option value="recommended">Recommended</option><option value="newest">Newest</option><option value="low">Price: Low to High</option></select><div class="view-toggle"><button class="active" id="grid-view" aria-label="Grid view">▦</button><button id="list-view" aria-label="List view">☷</button></div></div></div><div class="pills" id="pills"></div><div class="market-grid" id="market-grid"></div></section></div></main>
  <script src="catalog.js"></script><script>
    document.addEventListener('DOMContentLoaded',()=>{let listings=[...window.KwantuCatalog],type='all',category='',view='grid';const grid=document.getElementById('market-grid'),query=document.getElementById('query'),city=document.getElementById('city'),pills=document.getElementById('pills');const price=v=>Number(String(v).replace(/[^0-9.]/g,''))||0;const current=()=>{const q=query.value.toLowerCase(),c=city.value,min=Number(document.getElementById('min-price').value)||0,max=Number(document.getElementById('max-price').value)||99999;return listings.filter(x=>(type==='all'||x.kind===type)&&(!category||x.category===category)&&(!q||`${x.title} ${x.vendor} ${x.category}`.toLowerCase().includes(q))&&(c==='All Cities'||x.location.includes(c.split(',')[0]))&&price(x.price)>=min&&price(x.price)<=max&&(!document.getElementById('remote-only').checked||x.kind==='service'))};const card=x=>`<a class="listing ${x.size}" href="listing-detail.html?listing=${encodeURIComponent(x.id)}"><div class="listing-media"><img src="${x.image}" alt="${x.title}">${x.kind==='service'?'<span class="listing-type">Service</span>':''}<button class="heart" type="button" aria-label="Save ${x.title}">♡</button><span class="location">⌖ ${x.location}</span></div><div class="listing-body"><p class="listing-kicker">${x.category}</p><h2>${x.title}</h2><p class="listing-summary">${x.short}</p><p class="price">${x.price}</p><p class="vendor-line">${x.vendor}</p><span class="detail-link">View details →</span></div></a>`;function render(){let items=current(),sort=document.getElementById('sort').value;if(sort==='low')items=[...items].sort((a,b)=>price(a.price)-price(b.price));if(sort==='newest')items=[...items].reverse();grid.innerHTML=items.map(card).join('')||'<div class="empty"><b>No listings meet those filters.</b><p>Try clearing a category or widening your price range.</p></div>';grid.classList.toggle('list',view==='list');document.querySelector('#result-copy b').textContent=items.length;pills.innerHTML=[type!=='all'?type:'',category,city.value!=='All Cities'?city.value:''].filter(Boolean).map(p=>`<span class="pill">${p}<button aria-label="Remove ${p}">×</button></span>`).join('')};function reset(){type='all';category='';query.value='';city.value='All Cities';document.getElementById('min-price').value='';document.getElementById('max-price').value='';document.querySelectorAll('.checks input').forEach(x=>x.checked=false);document.querySelectorAll('.type-switch button').forEach((b,i)=>b.classList.toggle('active',i===0));document.querySelectorAll('.category-list button').forEach(b=>b.classList.remove('selected'));render()}document.querySelectorAll('.type-switch button').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('.type-switch button').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('.category-list button').forEach(b=>b.onclick=()=>{category=category===b.dataset.category?'':b.dataset.category;document.querySelectorAll('.category-list button').forEach(x=>x.classList.toggle('selected',x===b&&category));render()});document.getElementById('search-form').onsubmit=e=>{e.preventDefault();render()};query.oninput=render;city.onchange=render;document.getElementById('sort').onchange=render;document.getElementById('apply-filters').onclick=render;document.getElementById('reset-filters').onclick=document.getElementById('clear-filters').onclick=reset;document.getElementById('mobile-filter').onclick=()=>document.getElementById('filters').classList.toggle('open');document.getElementById('grid-view').onclick=()=>{view='grid';document.getElementById('grid-view').classList.add('active');document.getElementById('list-view').classList.remove('active');render()};document.getElementById('list-view').onclick=()=>{view='list';document.getElementById('list-view').classList.add('active');document.getElementById('grid-view').classList.remove('active');render()};grid.onclick=e=>{const h=e.target.closest('.heart');if(h){e.preventDefault();h.classList.toggle('saved');h.textContent=h.classList.contains('saved')?'♥':'♡'}};const prefill=new URLSearchParams(location.search).get('category');if(prefill){category=prefill;[...document.querySelectorAll('.category-list button')].find(x=>x.dataset.category===prefill)?.classList.add('selected')}render()});
  </script>
</body>
</html>
